<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <radialGradient id="portrait-bg" r=".6"><stop offset="0" stop-color="#2C4866"/><stop offset="1" stop-color="#0D1726"/></radialGradient>
    <radialGradient id="portrait-rim" cx=".85" cy=".35" r=".6"><stop offset="0" stop-color="#FFCF8A" stop-opacity=".55"/><stop offset="1" stop-color="#FFCF8A" stop-opacity="0"/></radialGradient>
    <linearGradient id="portrait-skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1C9A5"/><stop offset="1" stop-color="#D9A27C"/></linearGradient>
    <clipPath id="portrait-clip"><circle cx="110" cy="110" r="100"/></clipPath>
  </defs>
  <circle cx="110" cy="110" r="104" fill="#F2C46D"/>
  <g clip-path="url(#portrait-clip)">
    <rect width="220" height="220" fill="url(#portrait-bg)"/>
    <!-- camiseta verde-oliva -->
    <path d="M30 230 C35 180 70 165 110 165 C150 165 185 180 190 230Z" fill="#8F9C78"/>
    <path d="M88 166 Q110 186 132 166" fill="none" stroke="#7A8664" stroke-width="4"/>
    <!-- pescoço, orelhas e rosto -->
    <path d="M94 140 h32 v28 q-16 10 -32 0Z" fill="#D9A27C"/>
    <ellipse cx="66" cy="104" rx="9" ry="13" fill="#E2B08A"/>
    <ellipse cx="154" cy="104" rx="9" ry="13" fill="#E2B08A"/>
    <path d="M68 90 C68 58 86 46 110 46 C134 46 152 58 152 90 L152 112 C152 140 134 158 110 158 C86 158 68 140 68 112Z" fill="url(#portrait-skin)"/>
    <!-- cabelo curto escuro -->
    <path d="M64 92 C60 58 80 36 110 36 C142 36 160 56 156 92 C150 80 146 70 140 66 C126 72 96 70 82 64 C74 70 70 80 64 92Z" fill="#2E211B"/>
    <path d="M82 64 C96 70 126 72 140 66" fill="none" stroke="#45322A" stroke-width="3"/>
    <!-- sobrancelhas -->
    <path d="M80 85 q12 -6 24 -1" stroke="#2E211B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M116 84 q12 -5 24 1" stroke="#2E211B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- óculos redondos -->
    <circle cx="91" cy="104" r="14" fill="#A0C8DC" fill-opacity=".18" stroke="#4D4660" stroke-width="4"/>
    <circle cx="129" cy="104" r="14" fill="#A0C8DC" fill-opacity=".18" stroke="#4D4660" stroke-width="4"/>
    <path d="M105 102 q5 -3 10 0" stroke="#4D4660" stroke-width="4" fill="none"/>
    <path d="M77 101 l-10 -3 M143 101 l10 -3" stroke="#4D4660" stroke-width="3"/>
    <circle cx="91" cy="105" r="3.5" fill="#2A1D18"/>
    <circle cx="129" cy="105" r="3.5" fill="#2A1D18"/>
    <!-- nariz -->
    <path d="M110 108 q-6 14 -2 20 q4 2 8 0" fill="none" stroke="#C48A66" stroke-width="3" stroke-linecap="round"/>
    <!-- bigode, boca, cavanhaque e barba rala -->
    <path d="M88 134 C96 124 106 126 110 130 C114 126 124 124 132 134 C124 132 116 133 110 136 C104 133 96 132 88 134Z" fill="#6B4A33"/>
    <path d="M100 140 q10 3 20 0" stroke="#A5644E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M102 147 q8 4 16 0 l-2 8 q-6 4 -12 0Z" fill="#6B4A33"/>
    <path d="M80 140 C86 156 98 162 110 162 C122 162 134 156 140 140 C136 152 124 158 110 158 C96 158 84 152 80 140Z" fill="#7A5539" opacity=".55"/>
    <!-- luz quente de lado -->
    <rect width="220" height="220" fill="url(#portrait-rim)"/>
  </g>
</svg>
